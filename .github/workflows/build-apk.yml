name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Patch background-geolocation plugin (AGP version)
        run: sed -i "s/gradle:8.0.0'/gradle:8.13.0'/" node_modules/@capacitor-community/background-geolocation/android/build.gradle

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee ../build.log

      - name: Report Gradle error
        if: failure()
        run: |
          msg=$(grep -B2 -A25 -E "What went wrong|error:" build.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle failure::$msg"

      - uses: actions/upload-artifact@v4
        with:
          name: squadrats-live-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
